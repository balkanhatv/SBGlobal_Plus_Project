name: DD108 Canonical Dedupe Helper

on:
  push:
    branches:
      - docs/architecture-branch-2
    paths:
      - .github/workflows/dd108-canonical-dedupe-helper.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/architecture-branch-2
          fetch-depth: 0
      - name: Remove duplicate DD-108 append
        run: python3 .github/scripts/dd108_canonical_dedupe.py
      - name: Commit canonical repair and self-remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DetailedDesign/DD-17_TEST_ACCEPTANCE_CONTRACTS.md DetailedDesign/DD-18_DETAILED_DESIGN_DECISIONS.md
          git rm .github/workflows/dd108-canonical-dedupe-helper.yml .github/scripts/dd108_canonical_dedupe.py
          git commit -m 'fix(dd108): remove duplicate canonical append'
          git push origin HEAD:docs/architecture-branch-2
