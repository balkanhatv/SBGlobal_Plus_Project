name: Actions Startup Smoke

on:
  push:
    branches:
      - docs/architecture-branch-2
    paths:
      - ".github/workflows/actions-startup-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm runner startup
        run: echo "GitHub Actions runner started successfully"
