name: DD-108 Canonical Promotion Helper

on:
  push:
    branches:
      - docs/architecture-branch-2
    paths:
      - .github/workflows/dd108-canonical-promote.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          ref: docs/architecture-branch-2
          fetch-depth: 0

      - name: Append canonical DD-108 traceability
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e1e53969a3a2869e2c4612e45c65a7a3c66d2d58 HEAD
          DD18='DetailedDesign/DD-18_DETAILED_DESIGN_DECISIONS.md'
          DD17='DetailedDesign/DD-17_TEST_ACCEPTANCE_CONTRACTS.md'
          REG='Registers/DEVELOPMENT_DD108_VERIFICATION_2026-09-22.md'
          if ! grep -q '^## DD-108 — AI Model catalog metadata is readable as raw global evidence without creating model-selection authority$' "$DD18"; then
            printf '\n' >> "$DD18"
            printf '%s' '' | base64 -d >> "$DD18"
          fi
          if ! grep -q '^### AIMODEL-PG-001 — Exact immutable catalog evidence$' "$DD17"; then
            printf '\n' >> "$DD17"
            printf '%s' '' | base64 -d >> "$DD17"
          fi
          if [ ! -e "$REG" ]; then
            printf '%s' '' | base64 -d > "$REG"
          fi
          rm -f .github/workflows/dd108-canonical-promote.yml

      - name: Commit canonical promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DetailedDesign/DD-18_DETAILED_DESIGN_DECISIONS.md DetailedDesign/DD-17_TEST_ACCEPTANCE_CONTRACTS.md Registers/DEVELOPMENT_DD108_VERIFICATION_2026-09-22.md .github/workflows/dd108-canonical-promote.yml
          git diff --cached --quiet && exit 1
          git commit -m 'docs(dd): record DD-108 AI model metadata reader'
          git push origin HEAD:docs/architecture-branch-2
