name: DD-109 Canonical Promotion

on:
  push:
    branches:
      - docs/architecture-branch-2
    paths:
      - .github/workflows/dd109-canonical-promotion.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/architecture-branch-2
          fetch-depth: 0
      - name: Apply canonical DD-109 append
        run: python3 .github/scripts/dd109_canonical_promotion.py
      - name: Commit canonical traceability and self-remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/dd109-canonical-promotion.yml
          rm .github/scripts/dd109_canonical_promotion.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DetailedDesign/DD-18_DETAILED_DESIGN_DECISIONS.md DetailedDesign/DD-17_TEST_ACCEPTANCE_CONTRACTS.md .github/workflows/dd109-canonical-promotion.yml .github/scripts/dd109_canonical_promotion.py
          git diff --cached --quiet && exit 1
          git commit -m "docs(dd109): register capability catalog metadata reader"
          git push origin HEAD:docs/architecture-branch-2
