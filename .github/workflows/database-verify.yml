name: Database Verify

on:
  push:
    branches:
      - docs/architecture-branch-2
    paths:
      - "database/**"
      - ".github/workflows/database-verify.yml"
  pull_request:
    paths:
      - "database/**"
      - ".github/workflows/database-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sbglobal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sbglobal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sbglobal_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply migrations and verification
        run: |
          chmod +x database/scripts/apply-and-verify.sh
          database/scripts/apply-and-verify.sh

      - name: Report migration inventory
        if: always()
        run: |
          echo "Migrations:"
          find database/migrations -maxdepth 1 -type f -name '*.sql' | sort
          echo "Verification:"
          find database/verification -maxdepth 1 -type f -name '*.sql' | sort
