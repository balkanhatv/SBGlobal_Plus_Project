name: web-dependency-lock

on:
  push:
    branches:
      - docs/architecture-branch-2
    paths:
      - package.json
      - .github/workflows/web-dependency-lock.yml

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate deterministic npm lock update
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload generated package lock
        uses: actions/upload-artifact@v4
        with:
          name: web-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
