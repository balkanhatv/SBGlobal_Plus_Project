name: web-dependency-lock

on:
  push:
    branches:
      - docs/architecture-branch-2
    paths:
      - package.json
      - .github/workflows/web-dependency-lock.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/architecture-branch-2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate deterministic npm lock update
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated package lock
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(web): refresh npm lock for Next 15"
          git push origin HEAD:docs/architecture-branch-2
