name: Web Boundary Verify

on:
  push:
    branches:
      - docs/architecture-branch-2
    paths:
      - "src/app/**"
      - "src/core/**"
      - "src/server/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/web-dependency-lock.yml"
  pull_request:
    paths:
      - "src/app/**"
      - "src/core/**"
      - "src/server/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/web-dependency-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-boundary-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify tested commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git show -s --format='Tested commit: %H%nTree: %T%nParents: %P' HEAD

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify TypeScript composition
        run: npm run build:core

      - name: Verify Next.js 15 App Router boundary
        run: npm run build:web

      - name: Require clean generated state
        run: git diff --exit-code -- package.json package-lock.json tsconfig.json
