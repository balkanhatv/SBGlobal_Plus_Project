name: Web Dependency Lock Refresh

on:
  push:
    branches:
      - docs/architecture-branch-2
    paths:
      - "package.json"
      - ".github/workflows/web-dependency-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Generate npm lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: web-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
