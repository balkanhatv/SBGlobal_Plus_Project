name: DD-107 State Promotion Helper

on:
  push:
    branches:
      - docs/architecture-branch-2
    paths:
      - .github/workflows/dd107-state-promotion.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          ref: docs/architecture-branch-2
          fetch-depth: 0
      - name: Apply governed DD-107 state projection
        run: python3 .github/scripts/dd107_state_promotion.py
      - name: Commit promoted state and self-remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/dd107-state-promotion.yml
          rm .github/scripts/dd107_state_promotion.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DetailedDesign/DD-CHECKPOINT.md DetailedDesign/DD-INDEX.md DetailedDesign/DD-PHASE_STATE.md Development/CORE_SERVICE_CHECKPOINT.md Development/DEVELOPMENT_STATE.md State/HANDOFF_NOTE.md State/PHASE_SUMMARY.md State/PROJECT_MANIFEST.json State/PROJECT_STATE.md .github/workflows/dd107-state-promotion.yml .github/scripts/dd107_state_promotion.py
          git diff --cached --quiet && exit 1
          git commit -m "chore(state): promote DD-107 checkpoint"
          git push origin HEAD:docs/architecture-branch-2
