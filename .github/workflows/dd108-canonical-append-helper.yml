name: DD108 Canonical Append Helper

on:
  push:
    branches:
      - docs/architecture-branch-2
    paths:
      - .github/workflows/dd108-canonical-append-helper.yml

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/architecture-branch-2
          fetch-depth: 0
      - name: Apply canonical DD-108 append
        run: python3 .github/scripts/dd108_canonical_append.py
      - name: Commit canonical append and self-remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DetailedDesign/DD-17_TEST_ACCEPTANCE_CONTRACTS.md DetailedDesign/DD-18_DETAILED_DESIGN_DECISIONS.md
          git rm .github/workflows/dd108-canonical-append-helper.yml .github/scripts/dd108_canonical_append.py
          git commit -m 'docs(dd108): register model catalog metadata reader'
          git push origin HEAD:docs/architecture-branch-2
