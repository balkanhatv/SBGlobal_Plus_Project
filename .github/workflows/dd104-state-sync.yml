name: DD104 State Sync

on:
  push:
    branches:
      - docs/architecture-branch-2
    paths:
      - .github/workflows/dd104-state-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch current state without rewriting history
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifestPath = 'State/PROJECT_MANIFEST.json';
          const m = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const head = 'd02fd15421e41f4d1feee9e6725cc171f188c02a';
          const tree = 'a9f68aa0c5f3cf559319da324ec902f05c25c344';
          const checkpoint = 'DEV-WORKFLOW-TRANSITION-READ-001';
          const evidence = 'Registers/DEVELOPMENT_DD104_VERIFICATION_2026-09-22.md';
          const next = 'Source-audit the next independent source-complete Workflow persistence slice. Do not open workflow execution semantics unless source-owned. Notification runtime, secret retrieval, webhook/event runtime, Document signing, REST exposure, DD-076 and concrete AI Gateway remain unfinished.';

          m.updated = '2026-09-22';
          m.checkpoint = checkpoint;
          m.final_verdict = 'DD-104 WORKFLOWTRANSITION RAW APPEND-ONLY POSTGRESQL READER IMPLEMENTED / EXACT-HEAD TESTED; TRANSITION EXECUTION AUTHORITY UNCLAIMED';
          m.github.verified_code_head = head;
          m.github.verified_code_tree = tree;
          m.github.state_projection_basis_head = head;
          m.development.current_phase = 'WorkflowTransition raw append-only persistence reader verified; transition execution authority not claimed';
          m.development.next_action = next;
          m.development.database.ci_verified_head = head;
          m.development.database.ci_verified_tree = tree;
          m.development.database.ci_run_id = 35687267384;
          m.development.database.ci_job_id = 106616658762;
          m.development.database.feature_head_bootstrap_verified_head = head;
          m.development.database.feature_head_bootstrap_verified_tree = tree;
          m.development.database.feature_head_bootstrap_run_id = 35687267334;
          m.development.database.feature_head_bootstrap_job_id = 106616658240;
          m.development.database.feature_head_bootstrap_result = 'PASS_47_MIGRATIONS_41_VERIFICATION_FILES_PLUS_176_POSTGRES_TESTS';
          const cs = m.development.core_services;
          cs.checkpoint = checkpoint;
          cs.decision = 'DD-040–104 current implementation; DD-104 raw WorkflowTransition PostgreSQL reader';
          cs.verified_head = head;
          cs.verified_tree = tree;
          cs.core_ci_run_id = 35687267334;
          cs.core_ci_job_id = 106616658164;
          cs.tests = '311/311 PASS';
          cs.core_test_counts = {tests:311,pass:311,fail:0,skip:0};
          cs.postgres_ci_run_id = 35687267334;
          cs.postgres_ci_job_id = 106616658240;
          cs.postgres_tests = '176/176 PASS';
          cs.postgres_test_counts = {tests:176,pass:176,fail:0,skip:0};
          cs.database_regression_run_id = 35687267384;
          cs.database_regression_job_id = 106616658762;
          cs.database_regression_result = 'PASS';
          cs.next_action = next;
          for (const item of [
            'DD-104 raw WorkflowTransition read contract',
            'DD-104 PostgreSQL WorkflowTransition exact-by-id reader through dedicated Workflow worker role',
            'WTR-PG-001–007 real PostgreSQL parent-RLS and append-only acceptance'
          ]) if (!cs.implemented.includes(item)) cs.implemented.push(item);
          for (const item of [
            'WorkflowTransition selection/authorization and WorkflowInstance optimistic mutation',
            'Workflow state-machine/approval/rule execution from raw transition evidence',
            'WorkflowTransition-driven task mutation and downstream event emission'
          ]) if (!cs.not_claimed.includes(item)) cs.not_claimed.push(item);
          m.development.application_api_ui_scope_note = 'WorkflowDefinition, WorkflowInstance, WorkflowTask and WorkflowTransition exact-by-id raw persistence readers are implemented/tested through the dedicated Workflow worker/RLS boundary; execution, task actions and product UI remain unfinished.';
          m.current_phase = 'DEVELOPMENT_WORKFLOW_TRANSITION_READ_VERIFIED';
          m.continuation.checkpoint = checkpoint;
          m.continuation.verified_code_head = head;
          m.continuation.verified_code_tree = tree;
          m.continuation.source_audit = 'Development/WORKFLOW_TRANSITION_READER_PREREQUISITE_OWNERSHIP_AUDIT.md';
          if (!m.continuation.completed.includes('DD-104 raw WorkflowTransition PostgreSQL reader')) m.continuation.completed.push('DD-104 raw WorkflowTransition PostgreSQL reader');
          m.continuation.next_action = next;
          m.continuation.schema_or_verification_sql_changed = false;
          m.continuation.main_merge = false;
          m.current_audit_overlay = {
            checkpoint,
            verified_executable_basis: head,
            verified_executable_tree: tree,
            source_audit: 'Development/WORKFLOW_TRANSITION_READER_PREREQUISITE_OWNERSHIP_AUDIT.md',
            current_verification: evidence,
            scope: 'DD-104 exact-by-id raw append-only WorkflowTransition persistence only; no transition execution authority'
          };
          m.current_state_audit.verified_continuation_head = head;
          m.current_state_audit.inventory = {blobs:516,markdown:209,source_files:130,test_files:75,migrations:47,verification_files:41};
          m.current_feature_verification = {
            decision: 'DD-104 raw WorkflowTransition PostgreSQL reader',
            checkpoint,
            verified_head: head,
            verified_tree: tree,
            core: {run_id:35687267334,job_id:106616658164,tests:311,pass:311,fail:0,skip:0},
            postgres: {run_id:35687267334,job_id:106616658240,tests:176,pass:176,fail:0,skip:0,full_database_bootstrap:'PASS'},
            database: {run_id:35687267384,job_id:106616658762,conclusion:'success'},
            web: {run_id:35687267353,job_id:106616658102,conclusion:'success'},
            inventory: {blobs:516,markdown:209,source_files:130,test_files:75,migrations:47,verification_files:41},
            database_schema_change: false,
            evidence
          };
          fs.writeFileSync(manifestPath, JSON.stringify(m, null, 2) + '\n');

          const phasePath = 'State/PHASE_SUMMARY.md';
          let p = fs.readFileSync(phasePath, 'utf8');
          const marker = 'The sections below are chronological history of earlier gates and retain their original scope and evidence. Their former next-action and authorization statements are superseded by the current checkpoint.';
          const idx = p.indexOf(marker);
          if (idx < 0) throw new Error('PHASE_SUMMARY history marker missing');
          const history = p.slice(idx);
          const current = `# PHASE_SUMMARY — SBGlobal Plus\n**Updated:** 2026-09-22 · **Current checkpoint:** \`${checkpoint}\`\n\nVerified executable \`${head}\` / tree \`${tree}\`: **311/311 Core**, **176/176 PostgreSQL**, **47 migrations / 41 SQL verification files**, **Next.js build** and **Database Verify PASS**. Zero failed/skipped tests. Verified executable inventory: **516 blobs / 209 Markdown / 130 source / 75 test files**.\n\nDD-104 adds an exact-by-id raw WorkflowTransition PostgreSQL reader through the dedicated Workflow worker/RLS boundary. Append-only transition evidence remains non-authorizing and cannot select or execute a transition or mutate WorkflowInstance, WorkflowTask or event state.\n\nWorkflow transition/state-machine/approval/rule execution remains unfinished. Notification runtime, secret retrieval, webhook/event runtime, Document signing, REST exposure, DD-076 evaluator and concrete AI Gateway remain unfinished on their named prerequisites.\n\nNext: ${next}\n\n`;
          fs.writeFileSync(phasePath, current + history);
          NODE
      - name: Commit synchronized state and self-remove
        shell: bash
        run: |
          git config user.name "sbglobal-state-sync"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/dd104-state-sync.yml
          git add State/PROJECT_MANIFEST.json State/PHASE_SUMMARY.md
          git commit -m "docs(state): finalize DD-104 manifest and phase summary"
          git push origin HEAD:docs/architecture-branch-2
